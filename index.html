<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تلاجة القدس</title>
    <script src="vendor/xlsx.full.min.js"></script>
    <script src="vendor/supabase.min.js"></script>
    <script src="config.js"></script>
    <style>
      :root {
        --bg: #eaf2f6;
        --sheet: #fff;
        --rule: #cfdde5;
        --ink: #13232c;
        --ink2: #51656f;
        --cover: #0f3a52;
        --brass: #d8b46a;
        --in: #1f6f4a;
        --out: #b1342a;
        --gold: #9a6a12;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 "Segoe UI",
          Tahoma,
          system-ui,
          sans-serif;
      }
      header {
        background: var(--cover);
        color: #fff;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 18px;
        flex-wrap: wrap;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
        color: var(--brass);
      }
      nav {
        display: flex;
        gap: 4px;
        flex: 1;
        flex-wrap: wrap;
      }
      nav button {
        background: none;
        border: 0;
        color: #bcd3df;
        padding: 8px 14px;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        font: inherit;
      }
      nav button.on {
        background: var(--bg);
        color: var(--ink);
        font-weight: 700;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .sheet {
        background: var(--sheet);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .b {
        border: 1px solid var(--rule);
        background: #fff;
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font: inherit;
      }
      .b.pri {
        background: var(--cover);
        color: #fff;
        border-color: var(--cover);
      }
      .b.red {
        color: var(--out);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin: 8px 0;
      }
      .strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .strip div {
        background: var(--sheet);
        border: 1px solid var(--rule);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .strip span {
        display: block;
        color: var(--ink2);
        font-size: 13px;
      }
      .strip b {
        font-size: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--rule);
        text-align: right;
      }
      th {
        background: #f3f8fa;
        font-size: 13px;
        color: var(--ink2);
      }
      .n {
        font-variant-numeric: tabular-nums;
      }
      .in {
        color: var(--in);
      }
      .out {
        color: var(--out);
      }
      .gold {
        color: var(--gold);
      }
      .tag {
        font-size: 12px;
        border-radius: 6px;
        padding: 1px 8px;
        background: #e3eef4;
      }
      .tag.w {
        background: #f4e7c8;
      }
      .tag.s {
        background: #dcebd9;
      }
      .tag.x {
        background: #f3d9d6;
      }
      input,
      select {
        font: inherit;
        padding: 7px 9px;
        border: 1px solid var(--rule);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        width: 100%;
      }
      label {
        display: block;
        margin: 8px 0;
        font-size: 13px;
        color: var(--ink2);
      }
      #modal {
        position: fixed;
        inset: 0;
        background: #0008;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 30px 10px;
        overflow: auto;
        z-index: 9;
      }
      #modal .box {
        background: #fff;
        border-radius: 12px;
        padding: 18px;
        width: min(640px, 100%);
      }
      #modal h3 {
        margin: 0 0 8px;
      }
      .ln {
        display: grid;
        grid-template-columns: 3fr 1fr 1fr auto;
        gap: 6px;
        margin: 6px 0;
      }
      .seg {
        display: flex;
        gap: 6px;
      }
      .seg button {
        flex: 1;
        padding: 9px;
        border: 1px solid var(--rule);
        background: #fff;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
      }
      .seg button.on {
        background: var(--cover);
        color: #fff;
      }
      .tot {
        font-size: 18px;
        margin: 10px 0;
      }
      .pos {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 14px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .pos {
          grid-template-columns: 1fr;
        }
      }
      .big {
        padding: 14px 10px;
        border-radius: 12px;
        border: 2px solid var(--rule);
        background: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 17px;
        color: var(--ink);
      }
      .big.on,
      .tile.on {
        background: var(--cover);
        color: #fff;
        border-color: var(--cover);
      }
      .big.on small,
      .tile.on small {
        color: #cfe3ee;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
        gap: 8px;
        margin: 6px 0;
      }
      .tile {
        padding: 10px 6px;
        min-height: 76px;
        text-align: center;
        border: 2px solid var(--rule);
        border-radius: 12px;
        background: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 16px;
        color: var(--ink);
      }
      .tile small {
        display: block;
        color: var(--ink2);
        font-size: 12px;
      }
      .tile.low {
        border-color: var(--out);
      }
      .tile.low small:last-child {
        color: var(--out);
        font-weight: 700;
      }
      .pos h4 {
        margin: 14px 0 4px;
        color: var(--ink2);
      }
      .alert {
        background: #fdeceb;
        border: 1px solid #e7b3ae;
        color: #7d1f17;
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #7d1f17;
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        z-index: 20;
        max-width: 90vw;
      }
      .empty {
        color: var(--ink2);
        padding: 14px;
        text-align: center;
      }
      .login {
        max-width: 340px;
        margin: 12vh auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const $ = (s) => document.querySelector(s),
        app = $("#app");
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const f = (n) =>
        (Math.round((+n || 0) * 100) / 100).toLocaleString("en-US");
      const iso = () => {
        const d = new Date();
        return (
          d.getFullYear() +
          "-" +
          String(d.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(d.getDate()).padStart(2, "0")
        );
      };
      const uid = () => Math.random().toString(36).slice(2, 9);
      const C = window.CLINIC_CONFIG,
        sb = supabase.createClient(C.url, C.anonKey);
      const S = {
        items: [],
        months: {},
        cfg: { custs: [], svcs: [], pin: "", plog: [] },
        admin: false,
        low: false,
        day: iso(),
        view: "pos",
        rep: iso().slice(0, 7),
      };
      const KIND = { r: "قطاعي", w: "جملة" };
      const ent = (d) => (S.months[d.slice(0, 7)] || {})[d] || [];
      const item = (id) => S.items.find((x) => x.id === id);
      const norm = (s) =>
        String(s ?? "")
          .trim()
          .replace(/[أإآ]/g, "ا")
          .replace(/ة/g, "ه")
          .replace(/ى/g, "ي")
          .replace(/\s+/g, " ")
          .toLowerCase();
      const catOf = (n) => {
        const x = norm(n);
        if (/لحم|لحوم|بقري|ضاني|كندوز|جاموس/.test(x)) return "لحوم";
        if (/فراخ|دجاج|طيور/.test(x)) return "فراخ";
        if (/سمك|اسماك|جمبري/.test(x)) return "أسماك";
        return String(n).trim();
      };
      const num = (v) => {
        if (typeof v === "number") return v;
        const t = String(v ?? "")
          .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
          .replace(/[,٬\s]/g, "")
          .replace("٫", ".");
        return parseFloat(t) || 0;
      };
      const NOCAT = "بدون تصنيف",
        CATORD = ["لحوم", "فراخ", "أسماك"];
      const minOf = (x) => (x.min == null || x.min === "" ? 5 : +x.min);
      const lowItems = () => S.items.filter((x) => x.stock <= minOf(x));
      const pinSet = () => !!S.cfg.pin,
        isAdmin = () => !pinSet() || S.admin;
      const r2 = (n) => Math.round(n * 100) / 100;
      const catList = () =>
        [...new Set(S.items.map((x) => x.cat || NOCAT))].sort((a, b) => {
          const i = CATORD.indexOf(a),
            j = CATORD.indexOf(b);
          return (i < 0 ? 9 : i) - (j < 0 ? 9 : j) || a.localeCompare(b, "ar");
        });
      const custList = () => [
        ...new Set([...(S.cfg.custs || []), ...debts().map((d) => d[0])]),
      ];
      async function hash(t) {
        const x = "alq:" + t;
        if (window.crypto && crypto.subtle) {
          const b = await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(x),
          );
          return [...new Uint8Array(b)]
            .map((v) => v.toString(16).padStart(2, "0"))
            .join("");
        }
        let h = 5381;
        for (const c of x) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0;
        return "f" + h;
      }
      function toast(m, ms = 3500) {
        let t = $("#toast");
        if (!t) {
          t = document.createElement("div");
          t.id = "toast";
          t.className = "toast";
          document.body.append(t);
        }
        t.textContent = m;
        t.hidden = false;
        clearTimeout(toast.t);
        toast.t = setTimeout(() => (t.hidden = true), ms);
      }
      function alertBar() {
        const L = lowItems();
        if (!L.length) return "";
        const z = L.filter((x) => x.stock <= 0),
          l = L.filter((x) => x.stock > 0);
        const nm = (a) =>
          a
            .slice(0, 6)
            .map((x) => esc(x.name))
            .join("، ") + (a.length > 6 ? " …" : "");
        return `<div class="alert">⚠ ${z.length ? `<b>${z.length} صنف خلص:</b> ${nm(z)}` : ""}${z.length && l.length ? " — " : ""}${l.length ? `<b>${l.length} صنف قرب يخلص:</b> ${nm(l)}` : ""} ${isAdmin() ? '<button class="b" id="lowgo">عرض الناقص</button>' : ""}</div>`;
      }
      function itemOpts(sel, stockTxt = true) {
        const g = {};
        for (const x of S.items) (g[x.cat || NOCAT] ??= []).push(x);
        return Object.keys(g)
          .sort((a, b) => a.localeCompare(b, "ar"))
          .map(
            (c) =>
              `<optgroup label="${esc(c)}">${g[c]
                .sort((a, b) => a.name.localeCompare(b.name, "ar"))
                .map(
                  (x) =>
                    `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}${stockTxt ? ` (${x.stock} ${esc(x.unit)})` : ""}</option>`,
                )
                .join("")}</optgroup>`,
          )
          .join("");
      }

      /* ---------- data ---------- */
      async function load() {
        const { data, error } = await sb.from("docs").select("path,data");
        if (error) {
          alert("مشكلة في الاتصال: " + error.message);
          return;
        }
        S.items = [];
        S.months = {};
        S.cfg = { custs: [], svcs: [], pin: "", plog: [] };
        for (const r of data) {
          if (r.path === "items/main") S.items = r.data.list || [];
          else if (r.path === "cfg/main") S.cfg = { ...S.cfg, ...r.data };
          else if (r.path.startsWith("months/"))
            S.months[r.path.slice(7)] = r.data.days || {};
        }
      }
      const saveItems = () =>
        sb
          .from("docs")
          .upsert({
            path: "items/main",
            data: { list: S.items },
            updated_at: new Date().toISOString(),
          })
          .then((r) => {
            if (r.error) alert(r.error.message);
            return !r.error;
          });
      const saveCfg = () =>
        sb
          .from("docs")
          .upsert({
            path: "cfg/main",
            data: S.cfg,
            updated_at: new Date().toISOString(),
          })
          .then((r) => {
            if (r.error) alert(r.error.message);
            return !r.error;
          });
      const saveDay = (d) =>
        sb
          .rpc("set_day", {
            p_month: d.slice(0, 7),
            p_day: d,
            p_entries: ent(d),
          })
          .then((r) => {
            if (r.error) alert(r.error.message);
          });
      function stock(e, sg) {
        if (e.t === "sale")
          for (const l of e.lines) {
            const it = item(l.i);
            if (it) it.stock = +(it.stock - sg * l.q).toFixed(3);
          }
        if (e.t === "adj") {
          const it = item(e.i);
          if (it) it.stock = +(it.stock + sg * e.q).toFixed(3);
        }
        if (e.t === "buy")
          for (const l of e.lines) {
            const it = item(l.i);
            if (it) {
              it.stock = +(it.stock + sg * l.q).toFixed(3);
              if (sg > 0) it.cost = l.c;
            }
          }
      }
      async function addEntry(e, quiet) {
        const m = S.day.slice(0, 7);
        ((S.months[m] ??= {})[S.day] ??= []).push(e);
        stock(e, 1);
        await saveDay(S.day);
        if (e.t === "sale" || e.t === "buy" || e.t === "adj") await saveItems();
        if (!quiet) render();
      }
      async function delEntry(id) {
        if (!confirm("تمسح الحركة دي؟ (المخزون هيرجع زي ما كان)")) return;
        const m = S.day.slice(0, 7),
          a = S.months[m][S.day],
          i = a.findIndex((x) => x.id === id);
        if (i < 0) return;
        const e = a.splice(i, 1)[0];
        stock(e, -1);
        await saveDay(S.day);
        if (e.t === "sale" || e.t === "buy" || e.t === "adj") await saveItems();
        render();
      }

      /* ---------- calculations ---------- */
      function stats(es) {
        const s = {
          r: 0,
          w: 0,
          svc: 0,
          exp: 0,
          buy: 0,
          cashIn: 0,
          cashOut: 0,
          profit: 0,
          n: es.length,
        };
        for (const e of es) {
          if (e.t === "sale") {
            s[e.k] += e.total;
            s.cashIn += e.paid;
            s.profit += e.lines.reduce(
              (a, l) => a + (l.p - (l.c || 0)) * l.q,
              0,
            );
          } else if (e.t === "svc") {
            s.svc += e.total;
            s.cashIn += e.paid;
            s.profit += e.total;
          } else if (e.t === "pay") s.cashIn += e.amt;
          else if (e.t === "buy") {
            s.buy += e.total;
            s.cashOut += e.paid;
          } else if (e.t === "exp") {
            s.exp += e.amt;
            s.cashOut += e.amt;
            s.profit -= e.amt;
          }
        }
        return s;
      }
      const monthEs = (m) => Object.values(S.months[m] || {}).flat();
      function debts() {
        const m = {};
        for (const mo of Object.values(S.months))
          for (const es of Object.values(mo))
            for (const e of es) {
              const c = (e.cust || "").trim();
              if (!c) continue;
              if (e.t === "sale" || e.t === "svc")
                m[c] = (m[c] || 0) + e.total - e.paid;
              else if (e.t === "pay") m[c] = (m[c] || 0) - e.amt;
            }
        return Object.entries(m)
          .filter(([, v]) => Math.abs(v) > 0.009)
          .sort((a, b) => b[1] - a[1]);
      }
      const custNames = () => {
        const s = new Set();
        for (const mo of Object.values(S.months))
          for (const es of Object.values(mo))
            for (const e of es) if (e.cust) s.add(e.cust.trim());
        return [...s].map((x) => `<option value="${esc(x)}">`).join("");
      };
      function desc(e) {
        if (e.t === "sale")
          return `<span class="tag ${e.k === "w" ? "w" : ""}">${KIND[e.k]}</span> ${esc(e.cust || "نقدي")} — ${e.lines.map((l) => esc(l.n) + " " + l.q + " " + esc(l.u || "")).join("، ")}`;
        if (e.t === "svc")
          return `<span class="tag s">فرم/تقطيع</span> ${esc(e.cust || "نقدي")} — ${esc(e.what)} ${e.kg} كجم × ${f(e.rate)}`;
        if (e.t === "buy")
          return `<span class="tag x">شراء</span> ${esc(e.sup || "مورد")} — ${e.lines.map((l) => esc(l.n) + " " + l.q).join("، ")}`;
        if (e.t === "exp")
          return `<span class="tag x">مصروف</span> ${esc(e.what)}`;
        if (e.t === "pay")
          return `<span class="tag s">سداد</span> ${esc(e.cust)}`;
        if (e.t === "adj")
          return `<span class="tag x">تعديل مخزون</span> ${esc(e.n)} <b class="${e.q > 0 ? "in" : "out"}">${e.q > 0 ? "+" : ""}${f(e.q)} ${esc(e.u || "")}</b> — ${esc(e.why || "")}`;
        return "";
      }
      const amount = (e) =>
        e.t === "adj" ? null : e.t === "exp" || e.t === "pay" ? e.amt : e.total;

      /* ---------- modal ---------- */
      function modal(title, body, ok) {
        const d = document.createElement("div");
        d.id = "modal";
        d.innerHTML = `<div class="box"><h3>${title}</h3><div id="mb">${body}</div><div class="row"><button class="b pri" id="ok">حفظ</button><button class="b" id="no">إلغاء</button></div></div>`;
        document.body.append(d);
        d.querySelector("#no").onclick = () => {
          d.remove();
          render();
        };
        d.querySelector("#ok").onclick = async () => {
          const r = await ok(d);
          if (r !== false) {
            d.remove();
            render();
          }
        };
        return d;
      }
      const V = (d, id) => d.querySelector("#" + id).value;
      function fields(title, fs, ok) {
        const d = modal(
          title,
          fs
            .map((x) =>
              x.opts
                ? `<label>${x.l}<select id="${x.id}">${x.opts.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</select></label>`
                : `<label>${x.l}<input id="${x.id}" type="${x.t || "text"}" ${x.t === "number" ? 'step="any"' : ""} value="${esc(x.v ?? "")}" ${x.list ? `list="${x.list}"` : ""}></label>`,
            )
            .join("") +
            `<datalist id="cl">${custNames()}</datalist><datalist id="cats"><option value="لحوم"><option value="فراخ"><option value="أسماك"></datalist>`,
          ok,
        );
        return d;
      }

      /* ---------- forms ---------- */
      function buyForm() {
        let L = [{ i: "", q: 1, c: 0 }];
        const d = modal(
          "شراء بضاعة من مورد (بيزوّد المخزون)",
          `<label>المورد<input id="su"></label><div id="ls"></div><button type="button" class="b" id="al">+ صنف</button>
   <div class="tot">الإجمالي <b id="tt">0</b></div><label>المدفوع<input id="pd" type="number" step="any"></label>`,
          async () => {
            const ls = L.filter((l) => l.i && l.q > 0);
            if (!ls.length) {
              alert("اختار صنف وكمية");
              return false;
            }
            const lines = ls.map((l) => ({
                i: l.i,
                n: item(l.i).name,
                u: item(l.i).unit,
                q: l.q,
                c: l.c,
              })),
              total = lines.reduce((a, l) => a + l.q * l.c, 0);
            await addEntry({
              id: uid(),
              t: "buy",
              sup: V(d, "su"),
              lines,
              total,
              paid: Math.min(+V(d, "pd") || 0, total),
            });
          },
        );
        let man = false;
        const sum = () => {
          const t = L.reduce((a, l) => a + l.q * l.c, 0);
          d.querySelector("#tt").textContent = f(t);
          if (!man) d.querySelector("#pd").value = t;
        };
        const draw = () => {
          d.querySelector("#ls").innerHTML = L.map(
            (l, n) =>

      /* ---------- Excel import ---------- */
      const yes = (v) => {
        const t = norm(v);
        return t !== "" && !/^(لا|no|n|0|false|-|×)$/.test(t);
      };
      const HDR = [
        ["name", /^(اسم )?(الصنف|المنتج|الاسم|صنف|منتج|البيان)|^اسم/],
        ["top", /اكثر|مبيع|مميز|best|top/],
        ["wp", /جمل/],
        ["rp", /قطاع|تجزئ|بيع/],
        ["cost", /شراء|تكلف/],
        ["unit", /وحد/],
        ["stock", /رصيد|كمي|مخزون/],
        ["ctn", /كرتون/],
        ["min", /تنبيه|حد ال?ادني/],
      ];
      function readSheet(ws, cat) {
        const A = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        const hi = A.findIndex((r) => r.some((c) => String(c).trim() !== ""));
        if (hi < 0) return { rows: [], cols: {} };
        const cols = {};
        A[hi].forEach((h, i) => {
          const x = norm(h);
          if (!x) return;
          for (const [k, re] of HDR)
            if (cols[k] == null && re.test(x)) {
              cols[k] = i;
              break;
            }
        });
        if (cols.name == null) cols.name = 0;
        const rows = [];
        for (const r of A.slice(hi + 1)) {
          const name = String(r[cols.name] ?? "").trim();
          if (!name) continue;
          const o = { cat, name };
          if (cols.unit != null && String(r[cols.unit]).trim())
            o.unit = String(r[cols.unit]).trim();
          for (const k of ["wp", "rp", "cost", "stock", "ctn", "min"])
            if (cols[k] != null && String(r[cols[k]]).trim() !== "")
              o[k] = num(r[cols[k]]);
          if (cols.top != null) o.top = yes(r[cols.top]);
          rows.push(o);
        }
        return { rows, cols };
      }
      async function importItems(file) {

      async function confirmPos() {
        const sale = P.mode === "sale",
          cart = sale ? P.cart : P.scart;
        if (!cart.length) {
          toast("الفاتورة فاضية");
          return;
        }
        const total = r2(
            cart.reduce((a, l) => a + (sale ? l.q * l.p : l.total), 0),
          ),
          frac = P.pay === "full" ? 1 : P.pay === "none" ? 0 : +P.pay,
          paid = r2(total * frac),
          cust = P.cust;
        if (paid < total - 0.009 && !cust) {
          toast("اختار العميل الأول عشان الباقي يتسجل عليه آجل");
          return;
        }
        S.day = iso();
        let low = [];
        if (sale) {
          await addEntry(
            {
              id: uid(),
              t: "sale",
              k: P.k,
              cust,
              lines: cart.map(({ i, n, u, q, p, c }) => ({ i, n, u, q, p, c })),
              total,
              paid,
            },
            true,
          );
          low = [...new Set(cart.map((l) => l.i))]
            .map(item)
            .filter((x) => x && x.stock <= minOf(x));
        } else {
          let rest = paid;
          for (const l of cart) {
            const x = Math.min(rest, l.total);
            rest -= x;
            await addEntry(
              {
                id: uid(),
                t: "svc",
                cust,
                what: l.what,
                kg: l.kg,
                rate: l.rate,
                total: l.total,
                paid: x,
              },
              true,
            );
          }
        }
        cart.length = 0;
        P.pay = "full";
        P.sel = null;
        P.ssel = null;
        render();

          low.length
            ? "⚠ " +
                low
                  .map((x) =>
                    x.stock <= 0
                      ? x.name + " خلص"
                      : x.name +
                        " قرب يخلص (متبقي " +
                        f(x.stock) +
                        " " +
                        x.unit +
                        ")",

          low.length ? 7000 : 2500,

            tot = D.reduce((a, [, v]) => a + Math.max(0, v), 0);
          $("#main").innerHTML =
            `<div class="strip"><div><span>إجمالي الديون عند العملاء</span><b class="n gold">${f(tot)}</b></div></div><div class="sheet">${D.length ? `<table><thead><tr><th>العميل</th><th>الباقي عليه</th><th></th></tr></thead><tbody>${D.map(([c, v]) => `<tr><td>${esc(c)}</td><td class="n ${v > 0 ? "gold" : "in"}">${v > 0 ? f(v) : "له " + f(-v)}</td><td>${v > 0 ? `<button class="b" data-p="${esc(c)}" data-v="${v}">سداد</button>` : ""}</td></tr>`).join("")}</tbody></table>` : '<div class="empty">مفيش ديون</div>'}</div>`;
          document
            .querySelectorAll("[data-p]")
            .forEach(
              (b) => (b.onclick = () => payForm(b.dataset.p, b.dataset.v)),
            );
        },
        report() {
          const m = S.rep,
            es = monthEs(m),
            s = stats(es),
            days = Object.keys(S.months[m] || {}).sort();
          const top = {};
          for (const e of es)
            if (e.t === "sale")
              for (const l of e.lines) {
                const o = top[l.n] || (top[l.n] = { q: 0, v: 0, u: l.u });
                o.q += l.q;
                o.v += l.q * l.p;
              }
          const tp = Object.entries(top)
            .sort((a, b) => b[1].v - a[1].v)
            .slice(0, 10);
          $("#main").innerHTML =
            `<div class="row"><input type="month" id="mp" value="${m}" style="width:auto"><button class="b" id="xl">تصدير Excel</button></div>
     <div class="strip"><div><span>قطاعي</span><b class="n">${f(s.r)}</b></div><div><span>جملة</span><b class="n">${f(s.w)}</b></div><div><span>فرم وتقطيع</span><b class="n">${f(s.svc)}</b></div><div><span>مشتريات بضاعة</span><b class="n">${f(s.buy)}</b></div><div><span>مصاريف</span><b class="n out">${f(s.exp)}</b></div><div><span>صافي المكسب</span><b class="n in">${f(s.profit)}</b></div></div>
     <div class="hint" style="color:var(--ink2);margin-bottom:10px">المكسب = (سعر البيع − تكلفة الصنف وقت البيع) + إيراد الفرم والتقطيع − المصاريف. مشتريات البضاعة مش بتتخصم هنا لأنها محسوبة في تكلفة الصنف.</div>
     <div class="sheet"><b>يوم بيوم</b><table><thead><tr><th>اليوم</th><th>قطاعي</th><th>جملة</th><th>فرم/تقطيع</th><th>مصاريف</th><th>مكسب</th></tr></thead><tbody>${
       days
         .map((d) => {
           const x = stats(S.months[m][d]);
           return `<tr><td>${d}</td><td class="n">${f(x.r)}</td><td class="n">${f(x.w)}</td><td class="n">${f(x.svc)}</td><td class="n">${f(x.exp)}</td><td class="n">${f(x.profit)}</td></tr>`;
         })
         .join("") || '<tr><td colspan="6" class="empty">مفيش بيانات</td></tr>'
     }</tbody></table></div>
     <div class="sheet"><b>أكتر الأصناف مبيعًا</b><table><tbody>${tp.map(([n, o]) => `<tr><td>${esc(n)}</td><td class="n">${f(o.q)} ${esc(o.u || "")}</td><td class="n">${f(o.v)}</td></tr>`).join("") || '<tr><td class="empty">—</td></tr>'}</tbody></table></div>`;
          $("#mp").onchange = (e) => {
            S.rep = e.target.value || m;
            render();
          };
          $("#xl").onclick = () => {
            const rows = [];
            for (const d of days)
              for (const e of S.months[m][d])
                rows.push({
                  التاريخ: d,
                  النوع: {
                    sale: "بيع " + KIND[e.k || "r"],
                    svc: "فرم/تقطيع",
                    buy: "شراء",
                    exp: "مصروف",
                    pay: "سداد",
                    adj: "تعديل مخزون",
                  }[e.t],
                  العميل_أو_المورد: e.cust || e.sup || "",
                  البيان: desc(e).replace(/<[^>]+>/g, ""),
                  الإجمالي: amount(e),
                  المدفوع: e.paid ?? (e.t === "pay" ? e.amt : ""),
                });
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), m);
            XLSX.writeFile(wb, `تلاجة-القدس-${m}.xlsx`);
          };
        },
        backup() {
          $("#main").innerHTML =
            `<div class="sheet"><p>نسخة احتياطية كاملة (أصناف + كل الحركات + العملاء والخدمات والرقم السري) في ملف JSON.</p><div class="row"><button class="b pri" id="ex">تصدير نسخة احتياطية</button><label class="b" style="margin:0">استرجاع من ملف<input type="file" id="im" accept=".json" hidden></label></div></div>`;
          $("#ex").onclick = () => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(
              new Blob(
                [
                  JSON.stringify({
                    items: S.items,
                    months: S.months,
                    cfg: S.cfg,
                  }),
                ],
                { type: "application/json" },
              ),
            );
            a.download = `alqudus-backup-${iso()}.json`;
            a.click();
          };
          $("#im").onchange = async (e) => {
            const fl = e.target.files[0];
            if (!fl || !confirm("الاسترجاع هيكتب فوق البيانات الحالية. تكمّل؟"))
              return;
            try {
              const j = JSON.parse(await fl.text());
              S.items = j.items || [];
              await saveItems();
              if (j.cfg) {
                S.cfg = { ...S.cfg, ...j.cfg };
                await saveCfg();
              }
              for (const [m, days] of Object.entries(j.months || {}))
                await sb
                  .from("docs")
                  .upsert({ path: "months/" + m, data: { m, days } });
              await load();
              render();
              alert("تم الاسترجاع");
            } catch (x) {
              alert("الملف غير صالح");
            }
          };
        },
      };
      views.pos = posView;
      views.setup = setupView;
      const tabs = () =>
        isAdmin()
          ? [
              ["pos", "🛒 الكاشير"],
              ["day", "اليوم"],
              ["items", "الأصناف والمخزون"],
              ["setup", "العملاء والخدمات"],
              ["debts", "الديون"],
              ["report", "التقارير"],
              ["backup", "نسخ احتياطي"],
            ]
          : [
              ["pos", "🛒 الكاشير"],
              ["day", "فواتير اليوم"],
            ];
      function render() {
        if ($("#modal")) return;
        const T = tabs();
        if (!T.some((t) => t[0] === S.view)) S.view = "pos";
        app.innerHTML = `<header><h1>❄️ تلاجة القدس</h1><nav>${T.map(([k, l]) => `<button data-v="${k}" class="${S.view === k ? "on" : ""}">${l}</button>`).join("")}</nav>${pinSet() ? (S.admin ? '<button class="b" id="lk">🔒 قفل (وضع الكاشير)</button>' : '<button class="b" id="ul">👑 دخول المدير</button>') : ""}<button class="b" id="lo">خروج</button></header><main><div id="ab"></div><div id="main"></div></main>`;
        document.querySelectorAll("nav button").forEach(
          (b) =>
            (b.onclick = () => {
              S.view = b.dataset.v;
              render();
            }),
        );
        $("#ab").innerHTML = alertBar();
        if ($("#lowgo"))
          $("#lowgo").onclick = () => {
            S.view = "items";
            S.low = true;
            S.cat = "";
            S.q = "";
            render();
          };
        if ($("#lk"))
          $("#lk").onclick = () => {
            S.admin = false;
            render();
          };
        if ($("#ul"))
          $("#ul").onclick = () => {
            const d = fields(
              "دخول المدير",
              [{ id: "pn", l: "الرقم السري", t: "password" }],
              async () => {
                if ((await hash(V(d, "pn"))) === S.cfg.pin) S.admin = true;
                else {
                  alert("الرقم غلط");
                  return false;
                }
              },
            );
          };
        $("#lo").onclick = async () => {
          S.admin = false;
          await sb.auth.signOut();
          login();
        };
        views[S.view]();
      }
      function login(msg = "") {
        app.innerHTML = `<div class="login sheet"><h2>❄️ تلاجة القدس</h2><label>الإيميل<input id="em" type="email"></label><label>كلمة السر<input id="pw" type="password"></label><div class="out">${esc(msg)}</div><button class="b pri" id="go" style="width:100%">دخول</button></div>`;
        const go = async () => {
          const r = await sb.auth.signInWithPassword({
            email: $("#em").value.trim(),
            password: $("#pw").value,
          });
          r.error ? login("الإيميل أو كلمة السر غلط") : start();
        };
        $("#go").onclick = go;
        $("#pw").onkeydown = (e) => {
          if (e.key === "Enter") go();
        };
      }
      let sub = false;
      async function start() {
        await load();
        render();
        if (!sub) {
          sub = true;
          sb.channel("docs-live")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "docs" },
              () => load().then(render),
            )
            .subscribe();
        }
      }
      (async () => {
        const { data } = await sb.auth.getSession();
        data.session ? start() : login();
      })();
    </script>
  </body>
</html>
